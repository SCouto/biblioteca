<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta id="vp" name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis libros</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📚%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg:#f4f4f1; --card:#fff; --ink:#1d1d1f; --muted:#6e6e73; --line:#e3e3df; --accent:#3f7d1f; --on-accent:#fff;
    --ok:#1e7e34; --ok-bg:#e3f4e7; --loan:#a35c00; --loan-bg:#fdf0da; --late:#c62828; --late-bg:#fde7e7; --chip:#e9e9e5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#141416; --card:#202024; --ink:#f2f2f4; --muted:#9a9aa2; --line:#33333a; --accent:#8fd35a; --on-accent:#10200a;
      --ok:#7bd88f; --ok-bg:#16301d; --loan:#ffc069; --loan-bg:#3a2a0e; --late:#ff8a80; --late-bg:#3d1a1a; --chip:#2c2c32; }
  }
  :root[data-theme="dark"] { --bg:#141416; --card:#202024; --ink:#f2f2f4; --muted:#9a9aa2; --line:#33333a; --accent:#8fd35a; --on-accent:#10200a;
      --ok:#7bd88f; --ok-bg:#16301d; --loan:#ffc069; --loan-bg:#3a2a0e; --late:#ff8a80; --late-bg:#3d1a1a; --chip:#2c2c32; }
  :root[data-theme="light"] { color-scheme:light; }
  :root[data-theme="dark"] { color-scheme:dark; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); padding-bottom:96px; }
  .wrap { max-width:720px; margin:0 auto; padding:0 14px; }

  header { position:sticky; top:0; z-index:5; background:var(--bg); padding:14px 0 10px; }
  .top { display:flex; align-items:center; gap:10px; }
  .top h1 { font-size:20px; line-height:1.15; margin:0; flex:1; white-space:nowrap; min-width:0; }
  .top h1 small { display:block; font-size:12px; font-weight:500; color:var(--muted); letter-spacing:.01em; overflow:hidden; text-overflow:ellipsis; }
  .logo { width:46px; height:46px; border-radius:50%; flex:none; box-shadow:0 1px 4px rgba(0,0,0,.25); }
  @media (max-width:520px) { .top { gap:8px; } .logo { width:38px; height:38px; } .top h1 small { display:none; } .icon { padding:0 10px; } #themeBtn .lbl, #viewBtn .lbl, #statsBtn .lbl, #dataBtn .lbl { display:none; } }
  .icon { padding:0 12px; }
  .icon { background:var(--card); border:1px solid var(--line); color:var(--ink); border-radius:12px; height:44px; padding:0 14px; font-size:15px; cursor:pointer; }
  .tabs { display:flex; background:var(--chip); border-radius:12px; padding:4px; margin-top:12px; }
  .tabs button { flex:1; border:0; background:none; color:var(--muted); height:40px; border-radius:9px; font-size:16px; font-weight:600; cursor:pointer; }
  .tabs button.on { background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.15); }

  input, select { width:100%; height:48px; padding:0 12px; font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:12px; }
  input:focus, select:focus { outline:2px solid var(--accent); border-color:transparent; }
  .search { margin:6px 0 10px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; padding-bottom:10px; }
  .chip { flex:none; border:0; background:var(--chip); color:var(--ink); padding:9px 14px; border-radius:20px; font-size:14px; cursor:pointer; }
  .chip.on { background:var(--accent); color:var(--on-accent); font-weight:600; }

  .item { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:10px; }
  .row { display:flex; gap:10px; align-items:flex-start; }
  .grow { flex:1; min-width:0; }
  .t { font-weight:650; font-size:17px; overflow-wrap:anywhere; }
  .sub { color:var(--muted); font-size:14px; margin-top:2px; overflow-wrap:anywhere; }
  .badge { flex:none; font-size:13px; font-weight:650; padding:4px 11px; border-radius:20px; white-space:nowrap; }
  .b-loaned { color:var(--loan); background:var(--loan-bg); }
  .b-late { color:var(--late); background:var(--late-bg); }
  .b-returned, .b-avail { color:var(--ok); background:var(--ok-bg); }
  .dates { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; font-size:15px; }
  .dates small { display:block; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .warn { color:var(--late); font-size:14px; margin-top:8px; font-weight:600; }
  .acts { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .btn { height:44px; padding:0 16px; border-radius:12px; border:1px solid var(--line); background:none; color:var(--ink); font:inherit; font-size:15px; cursor:pointer; }
  .btn.primary { background:var(--accent); color:var(--on-accent); border-color:transparent; font-weight:650; }
  .btn.danger { color:var(--late); }
  .btn.block { width:100%; }
  .empty { text-align:center; color:var(--muted); padding:40px 10px; }

  .fab { position:fixed; right:18px; bottom:calc(18px + env(safe-area-inset-bottom)); width:60px; height:60px; border-radius:30px; border:0;
         background:var(--accent); color:var(--on-accent); font-size:32px; line-height:1; box-shadow:0 4px 14px rgba(0,0,0,.35); cursor:pointer; z-index:6; }

  #sheet { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:flex-end; justify-content:center; z-index:20; }
  #sheet.open { display:flex; }
  #sheetBody { background:var(--card); width:100%; max-width:560px; max-height:92vh; overflow:auto; border-radius:20px 20px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom)); }
  @media (min-width:600px) { #sheet { align-items:center; } #sheetBody { border-radius:20px; } }
  #sheetBody h2 { margin:0 0 14px; font-size:20px; }
  .f { margin-bottom:12px; }
  .f label { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; }
  .pick { margin-top:8px; border:1px solid var(--line); border-radius:12px; }
  .po { padding:10px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
  .po:last-child { border-bottom:0; }
  .po.on { background:var(--accent); color:var(--on-accent); } .po.on .sub { color:inherit; opacity:.85; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .btns { display:flex; gap:10px; margin-top:16px; } .btns .btn { flex:1; }
  .sec { margin:18px 0 8px; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .fstat { font-size:14px; padding:10px 12px; border-radius:12px; background:var(--chip); margin-bottom:10px; }
  .fstat.err { background:var(--late-bg); color:var(--late); }
  .stack { display:grid; gap:8px; }
  /* versión escritorio */
  body.desk .wrap { max-width:1100px; }
  body.desk header .top { gap:12px; }
  body.desk .tabs { max-width:520px; margin-left:auto; margin-right:auto; }
  body.desk .search { max-width:480px; margin-left:auto; margin-right:auto; display:block; }
  body.desk .chips { justify-content:center; }
  .tw { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  .tbl { width:100%; border-collapse:collapse; font-size:15px; }
  .tbl th { text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:12px 12px; border-bottom:1px solid var(--line); background:var(--chip); white-space:nowrap; }
  .tbl th.sortable { cursor:pointer; user-select:none; } .tbl th.sortable:hover { color:var(--ink); }
  .tbl td { padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }
  .tbl tr:last-child td { border-bottom:0; }
  .tbl tbody tr:hover { background:var(--chip); }
  .tbl td.r { text-align:right; white-space:nowrap; }
  .tbl .sub { margin:0; }
  .btn.sm { height:34px; padding:0 12px; font-size:14px; }
  body.desk .empty { grid-column:1/-1; }
  body.desk #sheet { align-items:center; }
  body.desk #sheetBody { border-radius:20px; }
  .click { cursor:pointer; }
  .po.lent { opacity:.55; cursor:default; }
  .chosen { display:flex; align-items:center; gap:10px; padding:10px 10px 10px 14px; border-radius:12px; background:var(--chip); border:1px solid var(--accent); }
  .chosen .x { flex:none; width:40px; height:40px; border-radius:50%; border:0; background:var(--late-bg); color:var(--late); font-size:18px; font-weight:700; cursor:pointer; }
  .banner { display:flex; align-items:center; gap:12px; margin:4px 0 10px; padding:10px 12px; border-radius:12px; font-size:14px; background:var(--loan-bg); color:var(--loan); }
  .banner span { flex:1; } .banner .btn { height:36px; font-size:14px; flex:none; }
  .banner.good { background:var(--ok-bg); color:var(--ok); }
  .dup { font-size:11px; font-weight:650; text-transform:uppercase; letter-spacing:.04em; color:var(--loan); background:var(--loan-bg); padding:2px 7px; border-radius:10px; margin-left:6px; vertical-align:middle; white-space:nowrap; }
  .btn.danger.sm { height:34px; font-size:14px; border-color:transparent; }
  .tabs button { font-size:15px; padding:0 4px; }
  .pager { display:flex; align-items:center; justify-content:center; gap:12px; margin:14px 0 4px; color:var(--muted); font-size:14px; }
  .pgbtn { position:fixed; top:50%; transform:translateY(-50%); z-index:4; width:58px; height:58px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--ink);
    font-size:38px; font-weight:700; line-height:1; padding:0 0 5px; cursor:pointer; box-shadow:0 3px 12px rgba(0,0,0,.28); opacity:.93; }
  .pgbtn:active { transform:translateY(-50%) scale(.94); }
  .pgbtn.prev { left:max(8px, calc(50% - 440px)); } .pgbtn.next { right:max(8px, calc(50% - 440px)); }
  body.desk .pgbtn.prev { left:max(8px, calc(50% - 640px)); } body.desk .pgbtn.next { right:max(8px, calc(50% - 640px)); }
  .pgbtn.off { visibility:hidden; }
  @media (max-width:520px) { .pgbtn { width:52px; height:52px; font-size:34px; opacity:.82; } .pgbtn.prev { left:6px; } .pgbtn.next { right:6px; } }
  textarea { width:100%; font:inherit; font-size:16px; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink); resize:vertical; }
  .rd { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); font-size:15px; } .rd span { flex:1; }
  .rd button { width:36px; height:36px; border-radius:50%; border:0; background:var(--late-bg); color:var(--late); font-weight:700; cursor:pointer; }
  .top .emoji { font-size:34px; line-height:1; flex:none; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:12px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 14px; }
  .kpi b { display:block; font-size:26px; line-height:1.1; } .kpi span { font-size:13px; color:var(--muted); }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:12px; }
  .scard { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; }
  .scard h3 { margin:0 0 2px; font-size:16px; } .scard .lead { font-size:13px; color:var(--muted); margin-bottom:10px; min-height:18px; }
  .scard .body { display:flex; align-items:center; gap:14px; }
  .donut { width:112px; height:112px; flex:none; transform:rotate(-90deg); }
  .donut text { transform:rotate(90deg); transform-origin:21px 21px; fill:var(--ink); text-anchor:middle; font-weight:700; font-size:8px; }
  .legend { list-style:none; margin:0; padding:0; flex:1; min-width:0; font-size:14px; }
  .legend li { display:flex; align-items:center; gap:8px; padding:4px 0; }
  .legend i { width:12px; height:12px; border-radius:50%; flex:none; }
  .legend .lg { flex:1; min-width:0; overflow-wrap:anywhere; line-height:1.25; }
  .legend small { color:var(--muted); width:34px; text-align:right; }
  .bars { display:grid; gap:10px; } .bhead { display:flex; gap:8px; justify-content:space-between; font-size:14px; } .bhead .lg { min-width:0; overflow-wrap:anywhere; line-height:1.25; }
  .bhead small { color:var(--muted); font-weight:400; } .bt { height:12px; border-radius:6px; background:var(--chip); overflow:hidden; margin-top:4px; } .bf { height:100%; border-radius:6px; }
  .stbl td { padding:7px 6px; } .stbl i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; }
  #statsBtn.on { background:var(--accent); color:var(--on-accent); border-color:transparent; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top"><span class="emoji" aria-hidden="true">📚</span><h1>Mis libros</h1><button class="icon" id="themeBtn" onclick="toggleTheme()"></button><button class="icon" id="statsBtn" onclick="toggleStats()"></button><button class="icon" id="viewBtn" onclick="toggleView()">🖥 PC</button><button class="icon" id="dataBtn" onclick="dataSheet()">⚙<span class="lbl"> Datos</span></button></div>
</div></header>

<main class="wrap">
  <div id="banner" class="banner hidden"></div>
  <div class="tabs" style="margin-bottom:10px"><button id="t-books" class="on" onclick="show('books')">Libros</button><button id="t-readers" onclick="show('readers')">Lectores/as</button></div>
  <section id="books">
  <input class="search" id="bSearch" type="search" placeholder="Buscar por título o autor…" oninput="PAGE.books=0;renderBooks()">
  <div class="chips" id="chips"></div>
  <div id="bookList"></div><div id="pg-books"></div>
  </section>
  <section id="readers" class="hidden">
    <input class="search" id="rSearch" type="search" placeholder="Buscar lector/a…" oninput="PAGE.readers=0;renderReaders()">
    <div id="readerList"></div><div id="pg-readers"></div>
  </section>
  <section id="stats" class="hidden"></section>
</main>

<button class="fab" id="fab" onclick="addAction()" aria-label="Añadir libro">+</button>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div id="sheetBody"></div></div>
<input id="csvIn" type="file" accept=".csv,text/csv" class="hidden" onchange="importCSV(event)">

<script>
const KEY = 'libros.v1';
const $ = id => document.getElementById(id);
let db = load(), rFilter = '', tab = 'books';
const PAGE_SIZE = 25, PAGE = { books: 0, readers: 0 };

function load() { let d; try { d = JSON.parse(localStorage.getItem(KEY)); } catch {} return normDb(d); }
function normDb(d) {
  d = d && typeof d === 'object' ? d : {};
  d.books = d.books || []; d.readers = d.readers || []; d.reads = d.reads || [];
  d.books.forEach((b, i) => { if (b.read) d.reads.push({ id: 'm' + i + Math.random().toString(36).slice(2, 7), bookId: b.id, who: '', date: b.read }); delete b.read; });   // versión anterior: una fecha por libro
  return d;
}
let saveTimer;
function saveLocal() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch {}
  clearTimeout(saveTimer); saveTimer = setTimeout(writeFile, 250);
}
function save() { saveLocal(); fbTouch(); }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today = () => ymd(new Date());
const addDays = (iso, n) => { const d = iso ? new Date(iso + 'T12:00:00') : new Date(); d.setDate(d.getDate() + n); return ymd(d); };
const fmt = iso => iso ? iso.split('-').reverse().join('/') : '—';
const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bookById = id => db.books.find(b => b.id === id);
const readerByName = n => { const k = norm(n || ''); return k ? db.readers.find(r => norm(r.name) === k) : null; };
function ensureReader(name) { name = (name || '').trim(); if (!name) return null; return readerByName(name) || (db.readers.push({ id: uid(), name }), db.readers[db.readers.length - 1]); }
function ensureReaders() { for (const r of db.reads) ensureReader(r.who); }
const readsOf = bookId => db.reads.filter(r => r.bookId === bookId).sort((a, b) => b.date.localeCompare(a.date));
/* Paginación: devuelve la parte visible de la lista y pinta los botones en #pg-<key> */
function paginate(list, key) {
  const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  PAGE[key] = Math.min(Math.max(0, PAGE[key]), pages - 1);
  const p = PAGE[key];
  $('pg-' + key).innerHTML = pages > 1 ? `<div class="pager"><span>${tr('Página {p} de {n}', { p: p + 1, n: pages })} · ${list.length}</span></div>
    <button class="pgbtn prev ${p ? '' : 'off'}" onclick="goPage('${key}',${p - 1})" aria-label="${tr('Anterior')}">‹</button>
    <button class="pgbtn next ${p < pages - 1 ? '' : 'off'}" onclick="goPage('${key}',${p + 1})" aria-label="${tr('Siguiente')}">›</button>` : '';
  return list.slice(p * PAGE_SIZE, (p + 1) * PAGE_SIZE);
}
function goPage(key, n) { PAGE[key] = n; render(); window.scrollTo(0, 0); }
/* ---------- Idioma (español / galego): el texto en español es la clave ---------- */
let LANG = 'es';
const GL = {
  "Buscar por título o autor…": "Buscar por título ou autor…",
  "Buscar por libro, autor o persona…": "Buscar por libro, autor ou persoa…",

/* ---------- Ventanas propias (el móvil bloquea alert/confirm/prompt) ---------- */
function openSheet(html) { $('sheetBody').innerHTML = html; $('sheet').classList.add('open'); }
function closeSheet() { $('sheet').classList.remove('open'); }
function dlgAlert(msg) {
  openSheet(`<p>${esc(msg)}</p><div class="btns"><button class="btn primary" onclick="closeSheet()">${tr('Aceptar')}</button></div>`);
}
function dlgConfirm(msg, okText = tr('Aceptar')) {
  return new Promise(res => {
    openSheet(`<p>${esc(msg)}</p><div class="btns"><button class="btn" id="dNo">${tr('Cancelar')}</button><button class="btn primary" id="dYes">${esc(okText)}</button></div>`);

}

}
function readSheet(bookId) {   // una lectura = persona (opcional) + fecha en que terminó el libro

}

/* ---------- Estadísticas ---------- */
const PALETTE = ['#3f7d1f', '#2f7fc1', '#d98a00', '#b5446e', '#7a5cc7'], OTHER_COLOR = '#8a8f98';
function topN(map, n = 5) {   // map: clave → {label, n}; devuelve los n primeros + «Otros»
  const all = Object.values(map).sort((a, b) => b.n - a.n || a.label.localeCompare(b.label, 'es'));
  const items = all.slice(0, n).map((x, i) => ({ ...x, color: PALETTE[i] }));
  const rest = all.slice(n).reduce((t, x) => t + x.n, 0);
  if (rest) items.push({ label: tr('Otros'), n: rest, color: OTHER_COLOR });
  return items;
}
let STATVIEW = 'donut'; try { STATVIEW = localStorage.getItem('libros.statview') || 'donut'; } catch {}
function setStatView(v) { STATVIEW = v; try { localStorage.setItem('libros.statview', v); } catch {} renderStats(); }
const statToggle = () => `<div class="chips" style="justify-content:flex-start">${[['donut', '◔ ' + tr('Rosca')], ['bars', '▤ ' + tr('Barras')], ['table', '☷ ' + tr('Tabla')]]
  .map(([k, n]) => `<button class="chip ${STATVIEW === k ? 'on' : ''}" onclick="setStatView('${k}')">${n}</button>`).join('')}</div>`;
function statCard(title, items, lead) {
  const total = items.reduce((t, x) => t + x.n, 0);
  if (!total) return `<div class="scard"><h3>${title}</h3><div class="lead"></div><div class="sub">${tr('Sin datos todavía.')}</div></div>`;
  const pc = x => Math.round(x.n / total * 100);
  let body;
  if (STATVIEW === 'bars') {
    const max = Math.max(...items.map(x => x.n));
    body = `<div class="bars">${items.map(x => `<div class="brow"><div class="bhead"><span class="lg">${esc(x.label)}</span><b>${x.n} <small>${pc(x)}%</small></b></div><div class="bt"><div class="bf" style="width:${x.n / max * 100}%;background:${x.color}"></div></div></div>`).join('')}</div>`;
  } else if (STATVIEW === 'table') {
    body = `<table class="tbl stbl"><tbody>${items.map(x => `<tr><td><i style="background:${x.color}"></i>${esc(x.label)}</td><td class="r"><b>${x.n}</b></td><td class="r sub">${pc(x)}%</td></tr>`).join('')}
      <tr><td><b>${tr('Total')}</b></td><td class="r"><b>${total}</b></td><td></td></tr></tbody></table>`;
  } else {
    let off = 0;
    const arcs = items.map(x => { const p = x.n / total * 100, c = `<circle r="15.915" cx="21" cy="21" fill="none" stroke="${x.color}" stroke-width="6" stroke-dasharray="${p} ${100 - p}" stroke-dashoffset="${-off}"><title>${esc(x.label)}: ${x.n}</title></circle>`; off += p; return c; }).join('');
    body = `<div class="body"><svg class="donut" viewBox="0 0 42 42" role="img" aria-label="${title}">${arcs}<text x="21" y="22.5">${total}</text></svg>
    <ul class="legend">${items.map(x => `<li><i style="background:${x.color}"></i><span class="lg" title="${esc(x.label)}">${esc(x.label)}</span><b>${x.n}</b><small>${pc(x)}%</small></li>`).join('')}</ul></div>`;
  }
  return `<div class="scard"><h3>${title}</h3><div class="lead">${lead || ''}</div>${body}</div>`;
}
function renderStats() {
  if (tab !== 'stats') return;
  const reads = db.reads, add = (m, k, label) => { if (!k) return; (m[k] = m[k] || { label, n: 0 }).n++; };

      ${statCard(tr('Autores más leídos'), authors, lead(authors))}
      ${statCard(tr('Colecciones más leídas'), colls, lead(colls))}

}

/* ---------- Sincronización con Firebase (opcional; sin login, el documento se protege con un código secreto largo) ----------
   Los datos siguen guardándose siempre en el navegador; Firebase es una copia sincronizada entre dispositivos.
   Un único documento libros/<código> = { data: JSON de db, rev: ms }. Cambios en dos sitios a la vez: se unen (no se pierde nada;
   un borrado hecho en un dispositivo puede reaparecer si el otro tenía cambios sin sincronizar). */
const FBK = 'libros.fb', FBM = 'libros.fbmeta', FBV = '10.12.2';
let fb = null, fbDoc = null, fbUnsub = null, fbPushT = null, fbMsg = () => '', fbErr = false;

const setMeta = o => { try { localStorage.setItem(FBM, JSON.stringify({ ...fbMeta(), ...o })); } catch {} };
function fbStatus(fn, err) { fbMsg = fn; fbErr = !!err; const e = $('fbStatus'); if (e) { e.textContent = fn(); e.classList.toggle('err', !!err); } }
function fbTouch() { if (!fb) return; setMeta({ dirty: true }); clearTimeout(fbPushT); fbPushT = setTimeout(() => fbDoc ? fbPush() : fbStart(), 800); }
function fbLoadSdk() {
  if (window.firebase && firebase.firestore) return Promise.resolve();
  const load = f => new Promise((res, rej) => { const t = document.createElement('script'); t.src = `https://www.gstatic.com/firebasejs/${FBV}/${f}`; t.onload = res; t.onerror = () => rej(new Error(tr('No hay conexión con Firebase.'))); document.head.appendChild(t); });
  return load('firebase-app-compat.js').then(() => load('firebase-firestore-compat.js'));
}
function fbMerge(local, remote) {   // une lo remoto con lo local sin borrar nada
  remote = normDb(remote);
  const ids = k => new Set(local[k].map(x => x.id));
  for (const k of ['books', 'reads']) { const have = ids(k); for (const x of remote[k]) if (!have.has(x.id)) local[k].push(x); }
  for (const r of remote.readers) if (!local.readers.some(x => norm(x.name) === norm(r.name))) local.readers.push(r);
}
function fbRemote(snap) {
  if (snap.metadata && snap.metadata.hasPendingWrites) return;   // eco de nuestra propia escritura
  const m = fbMeta(), r = snap.exists ? snap.data() : null;
  if (!r) { fbPush(); return; }   // documento nuevo: se siembra con los datos locales
  if (r.rev === m.rev) { fbOk(); if (m.dirty) fbPush(); return; }
  let remote; try { remote = JSON.parse(r.data); } catch { return fbStatus(() => tr('Datos remotos ilegibles.'), true); }
  if (m.dirty) { fbMerge(db, remote); setMeta({ rev: r.rev }); saveLocal(); render(); fbPush(); }   // cambios en los dos lados: se unen

}
const fbOk = () => { const hm = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }); fbStatus(() => '☁ ' + tr('Sincronizado') + ' ' + hm); };
async function fbPush() {

  try { await fbDoc.set({ data: JSON.stringify(db), rev }); fbOk(); }
  catch (e) { setMeta({ dirty: true }); fbStatus(() => tr('No se pudo sincronizar (se reintentará): ') + e.message, true); }
}
async function fbStart() {
  if (!fb) return;
  fbStatus(() => tr('Conectando con Firebase…'));
  try {
    await fbLoadSdk();
    const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(fb.config);
    fbDoc = firebase.firestore(app).collection('libros').doc(fb.code);
    if (fbUnsub) fbUnsub();
    fbUnsub = fbDoc.onSnapshot(fbRemote, e => fbStatus(() => tr('No se pudo sincronizar (se reintentará): ') + e.message, true));
  } catch (e) { fbDoc = null; fbStatus(() => e.message, true); }
}
function fbParse(txt) {   // acepta el JSON o el objeto JS que da la consola de Firebase, sin ejecutar nada
  const c = {}; for (const [, k, v] of txt.matchAll(/["']?(\w+)["']?\s*:\s*["']([^"']*)["']/g)) c[k] = v;
  return c.apiKey && c.projectId ? c : null;
}
function fbConnect() {

  if (!config) return dlgAlert(tr('No se encontró apiKey y projectId en la configuración pegada.'));
  let code = $('fbCode').value.trim();
  if (!code) code = Array.from(crypto.getRandomValues(new Uint8Array(24)), b => 'abcdefghijkmnpqrstuvwxyz23456789'[b % 32]).join('');
  if (!/^[A-Za-z0-9_-]{16,}$/.test(code)) return dlgAlert(tr('El código debe tener al menos 16 letras o números (sin espacios).'));

  fb = { config, code };
  try { localStorage.setItem(FBK, JSON.stringify(fb)); } catch {}

  fbStart().then(() => { if ($('fbCode')) dataSheet(); renderBanner(); });

}
function fbOff() {

}

/* ---------- CSV (se abre en Excel) ---------- */
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const ALIASES = {
  collection: ['collection','coleccion','serie','coleccion/serie'],
  course: ['course','curso','clase','grupo'],
  who: ['lector','lectora','lector/a','lectores','persona','persoa','reader','who','leido por','lido por','quien'],
  read: ['fecha lectura','fecha de lectura','fecha fin lectura','leido','read','read date','finished','data lectura','data de lectura','lido','fecha fin','fin lectura'],
  title: ['title','titulo','libro','book','nombre','name'],
  author: ['author','autor'],
  note: ['notes','note','notas','nota','isbn','isbn / notes','isbn / notas','observaciones'],
  id: ['id','id libro','identificador']
};
function colMap(header) {
  const h = header.map(norm), m = {};
  for (const [k, names] of Object.entries(ALIASES)) { const i = h.findIndex(x => names.includes(x)); if (i >= 0) m[k] = i; }
  return m;
}
function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  let lines = text.split(/\r?\n/);
  if (/^sep=/i.test(lines[0])) lines.shift();
  text = lines.join('\n');
  const first = text.split('\n')[0];
  const delim = [';', ',', '\t'].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); cur = ''; rows.push(row); row = []; }
    else cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function toISO(v) {   // acepta AAAA-MM-DD o DD/MM/AAAA (día primero)
  v = String(v || '').trim(); if (!v) return '';
  let m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);
  if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  return '';
}
const csvCell = v => /[",;\n\r]/.test(v ?? '') ? '"' + String(v).replace(/"/g, '""') + '"' : String(v ?? '');
function csvText() {   // una fila por lectura; libros sin lecturas, una fila con lector y fecha vacíos
  const rows = [['Título','Autor','Colección','Notas','Lector','Fecha lectura','ID']];
  for (const b of db.books) {
    const rs = readsOf(b.id).reverse();
    if (!rs.length) rows.push([b.title, b.author, b.collection || '', b.note, '', '', b.id]);
    for (const r of rs) rows.push([b.title, b.author, b.collection || '', b.note, r.who, r.date, b.id]);
  }
  const used = new Set(db.reads.map(r => norm(r.who)));   // lectores sin lecturas: fila propia, sin título
  for (const r of db.readers) if (!used.has(norm(r.name))) rows.push(['', '', '', '', r.name, '', '']);
  return 'sep=,\r\n' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
}
function exportCSV() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + csvText()], { type: 'text/csv;charset=utf-8' }));
  a.download = `libros-${today()}.csv`; a.click();
  try { localStorage.setItem('libros.lastBackup', String(Date.now())); } catch {}
  renderBanner();
}
/* Fusiona un CSV con los datos actuales (libros por ID, o por título+autor sin ID; lecturas sin duplicar). Devuelve {nb, nr} o {err}. */
function importText(text) {
  const rows = parseCSV(text);
  if (rows.length < 2) return { err: tr('El CSV está vacío.') };
  const m = colMap(rows[0]);
  if (m.title === undefined) return { err: tr('No se encontró una columna Título/Libro en la primera fila.') };
  const claimed = new Set();
  let nb = 0, nr = 0;
  const cell = (row, k) => (m[k] !== undefined ? (row[m[k]] || '').trim() : '');
  for (const row of rows.slice(1)) {
    const title = cell(row, 'title'), who = cell(row, 'who'), date = toISO(cell(row, 'read'));
    if (!title) { if (who) ensureReader(who); continue; }   // fila solo de lector/a
    const bid = cell(row, 'id'), hasRead = !!date;
    let b = bid ? db.books.find(x => x.id === bid) : null;
    if (!b && !bid) {   // sin ID (Excel a mano): puede haber ejemplares repetidos
      const same = db.books.filter(x => norm(x.title) === norm(title) && norm(x.author) === norm(cell(row, 'author')));
      b = hasRead ? same[0] : same.find(x => !claimed.has(x.id));
      if (b && !hasRead) claimed.add(b.id);
    }
    if (!b) { b = { id: bid || uid(), title, author: cell(row, 'author'), collection: cell(row, 'collection'), note: cell(row, 'note') }; db.books.push(b); nb++; if (!bid && !hasRead) claimed.add(b.id); }
    ensureReader(who);
    if (hasRead && !db.reads.some(r => r.bookId === b.id && norm(r.who) === norm(who) && r.date === date)) { db.reads.push({ id: uid(), bookId: b.id, who, date }); nr++; }
  }
  return { nb, nr };
}
function importCSV(e) {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    const res = importText(r.result);
    if (res.err) return dlgAlert(res.err);
    save(); render();
    dlgAlert(tr('Importado: {nb} libros nuevos, {nr} lecturas.', { nb: res.nb, nr: res.nr }));
  };
  r.readAsText(file); e.target.value = '';
}

    let t = 0; try { t = +localStorage.getItem('libros.lastBackup') || 0; } catch {}
    const days = t ? Math.floor((Date.now() - t) / 864e5) : null;
    if (days === null || days >= 7) html = `<span>⚠ ${days === null ? tr('Aún no has hecho ninguna copia.') : tr('Última copia hace {n} días.', { n: days })}</span><button class="btn" onclick="exportCSV()">${tr('Exportar todo')}</button>`;
  }
  el.innerHTML = html; el.classList.toggle('hidden', !html); el.classList.toggle('good', good);
}
function applyLang(l) {
  LANG = l; document.documentElement.lang = l;
  $('bSearch').placeholder = tr('Buscar por título o autor…');
  $('fab').setAttribute('aria-label', fabLabel());
  $('statsBtn').innerHTML = lbl(tr('📊 Estadísticas'));
  $('rSearch').placeholder = tr('Buscar lector/a…');
  if (fileMsgFn) fileMsg = fileMsgFn();
  applyTheme(document.documentElement.getAttribute('data-theme') || 'auto');
  applyView(document.body.classList.contains('desk'));
  render();
}
function setLang(l) { applyLang(l); try { localStorage.setItem('libros.lang', l); } catch {} dataSheet(); }
function toggleView() {
  const d = !document.body.classList.contains('desk');
  applyView(d); render(); try { localStorage.setItem('libros.view', d ? 'desk' : 'mobile'); } catch {}
}
function render() {
  renderBooks(); renderReaders(); renderStats();
  $('t-books').textContent = `${tr('Libros')} (${db.books.length})`;
  $('t-readers').textContent = `${tr('Lectores/as')} (${db.readers.length})`;
  renderBanner();
}
let v = null; try { v = localStorage.getItem('libros.view'); } catch {}
applyView(v ? v === 'desk' : screen.width >= 1000);
let savedTheme = null; try { savedTheme = localStorage.getItem('libros.theme'); } catch {}
applyTheme(THEMES.some(x => x[0] === savedTheme) ? savedTheme : 'auto');
let savedLang = null; try { savedLang = localStorage.getItem('libros.lang'); } catch {}
applyLang(savedLang || (/^gl/i.test(navigator.language || '') ? 'gl' : 'es'));
ensureReaders(); render(); initFile(); fbStart();
</script>
</body>
