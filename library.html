<style>
  :root {
    --bg:#f4f4f1; --card:#fff; --ink:#1d1d1f; --muted:#6e6e73; --line:#e3e3df; --accent:#3f7d1f; --on-accent:#fff;
    --ok:#1e7e34; --ok-bg:#e3f4e7; --loan:#a35c00; --loan-bg:#fdf0da; --late:#c62828; --late-bg:#fde7e7; --chip:#e9e9e5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#141416; --card:#202024; --ink:#f2f2f4; --muted:#9a9aa2; --line:#33333a; --accent:#8fd35a; --on-accent:#10200a;
      --ok:#7bd88f; --ok-bg:#16301d; --loan:#ffc069; --loan-bg:#3a2a0e; --late:#ff8a80; --late-bg:#3d1a1a; --chip:#2c2c32; }
  }
  :root[data-theme="dark"] { --bg:#141416; --card:#202024; --ink:#f2f2f4; --muted:#9a9aa2; --line:#33333a; --accent:#8fd35a; --on-accent:#10200a;
      --ok:#7bd88f; --ok-bg:#16301d; --loan:#ffc069; --loan-bg:#3a2a0e; --late:#ff8a80; --late-bg:#3d1a1a; --chip:#2c2c32; }
  :root[data-theme="light"] { color-scheme:light; }
  :root[data-theme="dark"] { color-scheme:dark; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); padding-bottom:96px; }
  .wrap { max-width:720px; margin:0 auto; padding:0 14px; }

  header { position:sticky; top:0; z-index:5; background:var(--bg); padding:14px 0 10px; }
  .top { display:flex; align-items:center; gap:10px; }
  .top h1 { font-size:20px; line-height:1.15; margin:0; flex:1; white-space:nowrap; min-width:0; }
  .top h1 small { display:block; font-size:12px; font-weight:500; color:var(--muted); letter-spacing:.01em; overflow:hidden; text-overflow:ellipsis; }
  .logo { width:46px; height:46px; border-radius:50%; flex:none; box-shadow:0 1px 4px rgba(0,0,0,.25); }
  @media (max-width:520px) { .top { gap:8px; } .logo { width:38px; height:38px; } .top h1 small { display:none; } .icon { padding:0 10px; } #themeBtn .lbl, #viewBtn .lbl { display:none; } }
  .icon { padding:0 12px; }
  .icon { background:var(--card); border:1px solid var(--line); color:var(--ink); border-radius:12px; height:44px; padding:0 14px; font-size:15px; cursor:pointer; }
  .tabs { display:flex; background:var(--chip); border-radius:12px; padding:4px; margin-top:12px; }
  .tabs button { flex:1; border:0; background:none; color:var(--muted); height:40px; border-radius:9px; font-size:16px; font-weight:600; cursor:pointer; }
  .tabs button.on { background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.15); }

  input, select { width:100%; height:48px; padding:0 12px; font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:12px; }
  input:focus, select:focus { outline:2px solid var(--accent); border-color:transparent; }
  .search { margin:6px 0 10px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; padding-bottom:10px; }
  .chip { flex:none; border:0; background:var(--chip); color:var(--ink); padding:9px 14px; border-radius:20px; font-size:14px; cursor:pointer; }
  .chip.on { background:var(--accent); color:var(--on-accent); font-weight:600; }

  .item { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:10px; }
  .row { display:flex; gap:10px; align-items:flex-start; }
  .grow { flex:1; min-width:0; }
  .t { font-weight:650; font-size:17px; overflow-wrap:anywhere; }
  .sub { color:var(--muted); font-size:14px; margin-top:2px; overflow-wrap:anywhere; }
  .badge { flex:none; font-size:13px; font-weight:650; padding:4px 11px; border-radius:20px; white-space:nowrap; }
  .b-loaned { color:var(--loan); background:var(--loan-bg); }
  .b-late { color:var(--late); background:var(--late-bg); }
  .b-returned, .b-avail { color:var(--ok); background:var(--ok-bg); }
  .dates { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; font-size:15px; }
  .dates small { display:block; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .warn { color:var(--late); font-size:14px; margin-top:8px; font-weight:600; }
  .acts { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .btn { height:44px; padding:0 16px; border-radius:12px; border:1px solid var(--line); background:none; color:var(--ink); font:inherit; font-size:15px; cursor:pointer; }
  .btn.primary { background:var(--accent); color:var(--on-accent); border-color:transparent; font-weight:650; }
  .btn.danger { color:var(--late); }
  .btn.block { width:100%; }
  .empty { text-align:center; color:var(--muted); padding:40px 10px; }

  .fab { position:fixed; right:18px; bottom:calc(18px + env(safe-area-inset-bottom)); width:60px; height:60px; border-radius:30px; border:0;
         background:var(--accent); color:var(--on-accent); font-size:32px; line-height:1; box-shadow:0 4px 14px rgba(0,0,0,.35); cursor:pointer; z-index:6; }

  #sheet { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:flex-end; justify-content:center; z-index:20; }
  #sheet.open { display:flex; }
  #sheetBody { background:var(--card); width:100%; max-width:560px; max-height:92vh; overflow:auto; border-radius:20px 20px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom)); }
  @media (min-width:600px) { #sheet { align-items:center; } #sheetBody { border-radius:20px; } }
  #sheetBody h2 { margin:0 0 14px; font-size:20px; }
  .f { margin-bottom:12px; }
  .f label { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; }
  .pick { margin-top:8px; border:1px solid var(--line); border-radius:12px; }
  .po { padding:10px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
  .po:last-child { border-bottom:0; }
  .po.on { background:var(--accent); color:var(--on-accent); } .po.on .sub { color:inherit; opacity:.85; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .btns { display:flex; gap:10px; margin-top:16px; } .btns .btn { flex:1; }
  .sec { margin:18px 0 8px; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .fstat { font-size:14px; padding:10px 12px; border-radius:12px; background:var(--chip); margin-bottom:10px; }
  .fstat.err { background:var(--late-bg); color:var(--late); }
  .stack { display:grid; gap:8px; }
  /* versión escritorio */
  body.desk .wrap { max-width:1100px; }
  body.desk header .top { gap:12px; }
  body.desk .tabs { max-width:380px; margin-left:auto; margin-right:auto; }
  body.desk .search { max-width:480px; margin-left:auto; margin-right:auto; display:block; }
  body.desk .chips { justify-content:center; }
  .tw { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  .tbl { width:100%; border-collapse:collapse; font-size:15px; }
  .tbl th { text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:12px 12px; border-bottom:1px solid var(--line); background:var(--chip); white-space:nowrap; }
  .tbl th.sortable { cursor:pointer; user-select:none; } .tbl th.sortable:hover { color:var(--ink); }
  .tbl td { padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }
  .tbl tr:last-child td { border-bottom:0; }
  .tbl tbody tr:hover { background:var(--chip); }
  .tbl td.r { text-align:right; white-space:nowrap; }
  .tbl .sub { margin:0; }
  .btn.sm { height:34px; padding:0 12px; font-size:14px; }
  body.desk .empty { grid-column:1/-1; }
  body.desk #sheet { align-items:center; }
  body.desk #sheetBody { border-radius:20px; }
  .click { cursor:pointer; }
  .po.lent { opacity:.55; cursor:default; }
  .chosen { display:flex; align-items:center; gap:10px; padding:10px 10px 10px 14px; border-radius:12px; background:var(--chip); border:1px solid var(--accent); }
  .chosen .x { flex:none; width:40px; height:40px; border-radius:50%; border:0; background:var(--late-bg); color:var(--late); font-size:18px; font-weight:700; cursor:pointer; }
  .banner { display:flex; align-items:center; gap:12px; margin:4px 0 10px; padding:10px 12px; border-radius:12px; font-size:14px; background:var(--loan-bg); color:var(--loan); }
  .banner span { flex:1; } .banner .btn { height:36px; font-size:14px; flex:none; }
  .banner.good { background:var(--ok-bg); color:var(--ok); }
  .dup { font-size:11px; font-weight:650; text-transform:uppercase; letter-spacing:.04em; color:var(--loan); background:var(--loan-bg); padding:2px 7px; border-radius:10px; margin-left:6px; vertical-align:middle; white-space:nowrap; }
  .btn.danger.sm { height:34px; font-size:14px; border-color:transparent; }
  .hidden { display:none !important; }
</style>
</head>

<main class="wrap">
  <div id="banner" class="banner hidden"></div>
  <section id="books">
    <input class="search" id="bSearch" type="search" placeholder="Buscar por título o autor…" oninput="renderBooks()">
    <div id="bookList"></div>
  </section>
  <section id="loans" class="hidden">
    <input class="search" id="lSearch" type="search" placeholder="Buscar por libro, autor o persona…" oninput="renderLoans()">
    <div class="chips" id="chips"></div>
    <div id="loanList"></div>
  </section>
</main>

<button class="fab" id="fab" onclick="addAction()" aria-label="Añadir">+</button>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div id="sheetBody"></div></div>
<input id="csvIn" type="file" accept=".csv,text/csv" class="hidden" onchange="importCSV(event)">

<script>
const KEY = 'library.v1';
const $ = id => document.getElementById(id);
let db = load(), tab = 'books', lFilter = '';

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || { books: [], loans: [] }; }
  catch { return { books: [], loans: [] }; }
}
let saveTimer;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch {}
  clearTimeout(saveTimer); saveTimer = setTimeout(writeFile, 250);
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today = () => ymd(new Date());
const addDays = (iso, n) => { const d = iso ? new Date(iso + 'T12:00:00') : new Date(); d.setDate(d.getDate() + n); return ymd(d); };
const fmt = iso => iso ? iso.split('-').reverse().join('/') : '—';
const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bookById = id => db.books.find(b => b.id === id);
const LABEL = { loaned: 'Prestado', late: 'Retrasado', returned: 'Devuelto' };
function status(l) { return l.returned ? 'returned' : (l.due < today() ? 'late' : 'loaned'); }
const activeLoan = bookId => db.loans.find(l => l.bookId === bookId && !l.returned);

/* ---------- Ventanas propias (el móvil bloquea alert/confirm/prompt) ---------- */
function openSheet(html) { $('sheetBody').innerHTML = html; $('sheet').classList.add('open'); }
function closeSheet() { $('sheet').classList.remove('open'); }
function dlgAlert(msg) {
  openSheet(`<p>${esc(msg)}</p><div class="btns"><button class="btn primary" onclick="closeSheet()">Aceptar</button></div>`);
}
function dlgConfirm(msg, okText = 'Aceptar') {
  return new Promise(res => {
    openSheet(`<p>${esc(msg)}</p><div class="btns"><button class="btn" id="dNo">Cancelar</button><button class="btn primary" id="dYes">${esc(okText)}</button></div>`);
    $('dNo').onclick = () => { closeSheet(); res(false); };
    $('dYes').onclick = () => { closeSheet(); res(true); };
  });
}

/* ---------- Navegación ---------- */
function show(t) {
  tab = t;
  for (const x of ['books', 'loans']) { $(x).classList.toggle('hidden', x !== t); $('t-' + x).classList.toggle('on', x === t); }
  $('fab').setAttribute('aria-label', t === 'books' ? 'Añadir libro' : 'Nuevo préstamo');
  window.scrollTo(0, 0);
}
function addAction() { tab === 'books' ? bookSheet() : loanSheet(); }

/* ---------- Libros ---------- */
function bookSheet(id) {
  const b = id ? bookById(id) : null;
  openSheet(`<h2>${b ? 'Editar libro' : 'Añadir libro'}</h2>
    <form id="bf">
      <div class="f"><label>Título *</label><input id="bTitle" required autocomplete="off" value="${esc(b?.title || '')}"></div>
      <div class="f"><label>Autor</label><input id="bAuthor" autocomplete="off" value="${esc(b?.author || '')}"></div>
      <div class="f"><label>ISBN / Notas</label><input id="bNote" autocomplete="off" value="${esc(b?.note || '')}"></div>
      <div class="btns"><button type="button" class="btn" onclick="closeSheet()">Cancelar</button><button class="btn primary">Guardar</button></div>
      ${b ? `<div class="btns"><button type="button" class="btn danger sm" onclick="delBook('${b.id}')">Borrar este libro…</button></div>` : ''}
    </form>`);
  $('bf').onsubmit = e => {
    e.preventDefault();
    const d = { title: $('bTitle').value.trim(), author: $('bAuthor').value.trim(), note: $('bNote').value.trim() };
    if (b) Object.assign(b, d); else db.books.push({ id: uid(), ...d });
    save(); closeSheet(); render();
  };
  setTimeout(() => $('bTitle').focus(), 50);
}
async function delBook(id) {
  if (activeLoan(id)) return dlgAlert('Este libro está prestado ahora mismo. Márcalo como devuelto antes de borrarlo.');
  if (!await dlgConfirm('¿Borrar este libro y su historial de préstamos?', 'Borrar')) return;
  db.books = db.books.filter(b => b.id !== id);
  db.loans = db.loans.filter(l => l.bookId !== id);
  save(); render();
}
const dupKey = b => norm(b.title) + '|' + norm(b.author);
function renderBooks() {
  const dupCount = {}; for (const b of db.books) dupCount[dupKey(b)] = (dupCount[dupKey(b)] || 0) + 1;
  const dup = b => dupCount[dupKey(b)] > 1 ? ' <span class="dup" title="Hay más de un ejemplar con este título y autor">duplicado</span>' : '';
  const q = $('bSearch').value.toLowerCase();
  const list = db.books.filter(b => (b.title + ' ' + b.author + ' ' + b.note).toLowerCase().includes(q))
    .sort((a, b) => a.title.localeCompare(b.title));
  if (isDesk()) {
    const st = b => { const o = activeLoan(b.id); return o ? status(o) : 'avail'; };
    const val = { title: b => b.title, author: b => b.author, note: b => b.note, state: st, who: b => activeLoan(b.id)?.who, due: b => activeLoan(b.id)?.due };
    const g = val[SORT.books.k];
    const rows = [...list].sort((a, b) => SORT.books.d * cmp(g(a), g(b)));
    $('bookList').innerHTML = rows.length ? `<div class="tw"><table class="tbl"><thead><tr>
      ${th('books','title','Título')}${th('books','author','Autor')}${th('books','note','ISBN / Notas')}${th('books','state','Estado')}${th('books','who','Prestado a')}${th('books','due','Devolver el')}<th></th></tr></thead><tbody>
      ${rows.map(b => { const o = activeLoan(b.id), s = o && status(o);
        return `<tr class="click" onclick="bookSheet('${b.id}')" title="Editar"><td><b>${esc(b.title)}</b>${dup(b)}</td><td>${esc(b.author)}</td><td>${esc(b.note)}</td>
          <td><span class="badge ${o ? 'b-' + s : 'b-avail'}">${o ? LABEL[s] : 'Disponible'}</span></td>
          <td>${o ? esc(o.who) : ''}</td><td>${o ? fmt(o.due) : ''}</td>
          <td class="r" onclick="event.stopPropagation()">${o ? `<button class="btn sm" onclick="returnSheet('${o.id}')">Marcar devuelto</button>` : `<button class="btn sm primary" onclick="loanSheet('${b.id}')">Prestar</button>`}</td></tr>`; }).join('')}
      </tbody></table></div>`
      : `<div class="empty">${db.books.length ? 'Ningún libro coincide.' : 'Aún no hay libros.<br>Pulsa <b>+</b> para añadir el primero.'}</div>`;
    return;
  }
  $('bookList').innerHTML = list.length ? list.map(b => {
    const out = activeLoan(b.id), s = out && status(out);
    const badge = out ? `<span class="badge b-${s}">${s === 'late' ? 'Retrasado' : 'Prestado'}</span>` : `<span class="badge b-avail">Disponible</span>`;
    return `<div class="item">
      <div class="row"><div class="grow click" onclick="bookSheet('${b.id}')"><div class="t">${esc(b.title)}${dup(b)}</div>
        <div class="sub">${esc([b.author, b.note].filter(Boolean).join(' · ')) || '&nbsp;'}</div>
        ${out ? `<div class="sub">con ${esc(out.who)} · devolver el ${fmt(out.due)}</div>` : ''}</div>${badge}</div>
      <div class="acts">
        ${out ? `<button class="btn" onclick="returnSheet('${out.id}')">Marcar devuelto</button>` : `<button class="btn primary" onclick="loanSheet('${b.id}')">Prestar</button>`}</div>
    </div>`;
  }).join('') : `<div class="empty">${db.books.length ? 'Ningún libro coincide.' : 'Aún no hay libros.<br>Pulsa <b>+</b> para añadir el primero.'}</div>`;
}

/* ---------- Préstamos ---------- */
function loanSheet(bookId) {
  const avail = db.books.filter(b => !activeLoan(b.id)).sort((a, b) => a.title.localeCompare(b.title));
  if (!avail.length) return dlgAlert(db.books.length ? 'Todos los libros están prestados.' : 'Primero añade algún libro en la pestaña Libros.');
  const people = [...new Set(db.loans.map(l => l.who).filter(Boolean))];
  openSheet(`<h2>Nuevo préstamo</h2>
    <form id="lf">
      <div class="f"><label>Libro *</label><div id="bookBox"></div></div>
      <div class="f"><label>Prestado a *</label><input id="lWho" required list="people" autocomplete="off"><datalist id="people">${people.map(p => `<option value="${esc(p)}">`).join('')}</datalist></div>
      <div class="two">
        <div class="f"><label>Fecha de préstamo</label><input id="lDate" type="date" required value="${today()}"></div>
        <div class="f"><label>Devolución prevista</label><input id="lDue" type="date" required value="${addDays(null, 14)}"></div>
      </div>
      <div class="btns"><button type="button" class="btn" onclick="closeSheet()">Cancelar</button><button class="btn primary">Prestar</button></div>
    </form>`);
  let sel = bookId || (avail.length === 1 ? avail[0].id : '');
  const drawPick = () => {
    const q = norm($('lSearchBook').value);
    $('pick').classList.toggle('hidden', !q);
    if (!q) { $('pick').innerHTML = ''; return; }
    const tk = q.split(/\s+/);
    const score = b => {   // cuanto más baja, más se parece
      const t = norm(b.title);
      return (t.startsWith(q) ? 0 : t.includes(q) ? 1 : tk.every(w => t.includes(w)) ? 2 : 3) + (activeLoan(b.id) ? 0.5 : 0);
    };
    const all = db.books.filter(b => { const h = norm(b.title + ' ' + b.author + ' ' + b.note); return tk.every(w => h.includes(w)); })
      .sort((a, b) => score(a) - score(b) || a.title.localeCompare(b.title));
    $('pick').innerHTML = all.length ? all.slice(0, 6).map(b => {
        const out = activeLoan(b.id);   // prestado: sale igual pero no se puede elegir
        return `<div class="po ${out ? 'lent' : ''}" ${out ? '' : `data-id="${b.id}"`}><div class="row"><div class="grow"><div class="t">${esc(b.title)}</div>${b.author ? `<div class="sub">${esc(b.author)}</div>` : ''}</div>${out ? '<span class="badge b-loaned">PRESTADO</span>' : ''}</div></div>`;
      }).join('') + (all.length > 6 ? `<div class="sub" style="padding:10px 12px">y ${all.length - 6} más… sigue escribiendo</div>` : '')
      : '<div class="sub" style="padding:12px">Ningún libro coincide.</div>';
  };
  const drawBox = (focus) => {
    const b = sel && bookById(sel);
    if (b) {   // libro ya elegido: solo su tarjeta y una X roja para quitarlo
      $('bookBox').innerHTML = `<div class="chosen"><div class="grow"><div class="t">${esc(b.title)}</div>${b.author ? `<div class="sub">${esc(b.author)}</div>` : ''}</div>
        <button type="button" class="x" id="unpick" aria-label="Quitar este libro" title="Quitar este libro">✕</button></div>`;
      $('unpick').onclick = () => { sel = ''; drawBox(true); };
      if (focus) $('lWho').focus();
    } else {
      $('bookBox').innerHTML = `<input id="lSearchBook" type="search" placeholder="Buscar por título o autor…" autocomplete="off"><div id="pick" class="pick"></div>`;
      $('lSearchBook').oninput = drawPick;

/* ---------- CSV (se abre en Excel) ---------- */
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const ALIASES = {
  title: ['title','titulo','libro','book','nombre','name'],
  author: ['author','autor'],
  note: ['notes','note','notas','nota','isbn','isbn / notes','isbn / notas','observaciones'],
  who: ['borrower','prestado a','persona','who','quien','to','prestatario','usuario'],
  date: ['loan date','loaned','date','fecha','fecha prestamo','fecha de prestamo','prestamo'],
  due: ['expected return','due','due date','return due','fecha prevista','devolucion prevista','fecha devolucion prevista','fecha limite'],
  returned: ['returned date','actual return','returned on','return date','fecha devolucion','devuelto','fecha de devolucion','devolucion'],
  status: ['status','estado'],
  id: ['id','id libro','identificador']
};
function colMap(header) {
  const h = header.map(norm), m = {};
  for (const [k, names] of Object.entries(ALIASES)) { const i = h.findIndex(x => names.includes(x)); if (i >= 0) m[k] = i; }
  return m;
}
function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  let lines = text.split(/\r?\n/);
  if (/^sep=/i.test(lines[0])) lines.shift();
  text = lines.join('\n');
  const first = text.split('\n')[0];
  const delim = [';', ',', '\t'].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); cur = ''; rows.push(row); row = []; }
    else cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function toISO(v) {   // acepta AAAA-MM-DD o DD/MM/AAAA (día primero)
  v = String(v || '').trim(); if (!v) return '';
  let m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);
  if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  return '';
}
const csvCell = v => /[",;\n\r]/.test(v ?? '') ? '"' + String(v).replace(/"/g, '""') + '"' : String(v ?? '');
function csvText() {   // un solo CSV: una fila por préstamo; libros sin préstamos, una fila con los datos del préstamo vacíos
  const rows = [['Título','Autor','Notas','Prestado a','Fecha préstamo','Devolución prevista','Fecha devolución','Estado','ID']];
  for (const b of db.books) {
    const ls = db.loans.filter(l => l.bookId === b.id);
    if (!ls.length) rows.push([b.title, b.author, b.note, '', '', '', '', '', b.id]);
    for (const l of ls) rows.push([b.title, b.author, b.note, l.who, l.date, l.due, l.returned || '', LABEL[status(l)], b.id]);
  }
  return 'sep=,\r\n' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
}
function exportCSV() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + csvText()], { type: 'text/csv;charset=utf-8' }));
  a.download = `luceroteka-${today()}.csv`; a.click();
  try { localStorage.setItem('library.lastBackup', String(Date.now())); } catch {}
  renderBanner();
}
/* Fusiona un CSV con los datos actuales (libros por ID o título; préstamos sin duplicar). Devuelve {nb, nl} o {err}. */
function importText(text) {
  const rows = parseCSV(text);
  if (rows.length < 2) return { err: 'El CSV está vacío.' };
  const m = colMap(rows[0]);
  if (m.title === undefined) return { err: 'No se encontró una columna Título/Libro en la primera fila.' };
  const claimed = new Set();
  let nb = 0, nl = 0;
  const cell = (row, k) => (m[k] !== undefined ? (row[m[k]] || '').trim() : '');
  for (const row of rows.slice(1)) {
    const title = cell(row, 'title'); if (!title) continue;
    const bid = cell(row, 'id'), hasLoan = !!cell(row, 'who');
    let ret = toISO(cell(row, 'returned'));
    if (!ret && /^(returned|devuelto)/.test(norm(cell(row, 'status')))) ret = today();
    let b = bid ? db.books.find(x => x.id === bid) : null;
    if (!b && !bid) {   // sin ID (Excel a mano): puede haber ejemplares repetidos con el mismo título
      const same = db.books.filter(x => norm(x.title) === norm(title));
      b = hasLoan ? (same.find(x => !activeLoan(x.id)) || (ret ? same[0] : null)) : same.find(x => !claimed.has(x.id));
      if (b && !hasLoan) claimed.add(b.id);
    }
    if (!b) { b = { id: bid || uid(), title, author: cell(row, 'author'), note: cell(row, 'note') }; db.books.push(b); nb++; if (!bid && !hasLoan) claimed.add(b.id); }
    if (!hasLoan) continue;
    const who = cell(row, 'who');
    const date = toISO(cell(row, 'date')) || today();
    const due = toISO(cell(row, 'due')) || date;
    const same = db.loans.find(l => l.bookId === b.id && l.who === who && l.date === date);
    if (same) { if (ret && !same.returned) same.returned = ret; continue; }   // devuelto en un lado y abierto en el otro: gana la devolución
    if (!ret && activeLoan(b.id)) continue;
    db.loans.push({ id: uid(), bookId: b.id, who, date, due, returned: ret || null }); nl++;
  }
  return { nb, nl };
}
function importCSV(e) {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    const res = importText(r.result);
    if (res.err) return dlgAlert(res.err);
    save(); render();
    dlgAlert(`Importado: ${res.nb} libros nuevos, ${res.nl} préstamos.`);
  };
  r.readAsText(file); e.target.value = '';
}

let fileHandle = null, needReconnect = false;
const FS = 'showSaveFilePicker' in window;
const idb = () => new Promise((res, rej) => { const q = indexedDB.open('library-fs', 1); q.onupgradeneeded = () => q.result.createObjectStore('h'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
async function idbSet(v) { const d = await idb(); return new Promise((res, rej) => { const t = d.transaction('h', 'readwrite'); t.objectStore('h').put(v, 'handle'); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
async function idbGet() { const d = await idb(); return new Promise((res, rej) => { const q = d.transaction('h').objectStore('h').get('handle'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
const FTYPES = [{ description: 'Datos de Luceroteka (CSV)', accept: { 'text/csv': ['.csv'] } }];

async function writeFile() {
  if (!fileHandle) return;
  try {
    const w = await fileHandle.createWritable();
    await w.write('\ufeff' + csvText()); await w.close();
    try { localStorage.setItem('library.lastBackup', String(Date.now())); } catch {}
    fstat('💾 ' + fileHandle.name + ' — guardado ' + new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }));
  } catch (e) { fstat('Error al guardar en el archivo: ' + e.message, true); }
}
/* Fusiona el archivo con los datos del navegador y reescribe el archivo con el resultado (no se pierde nada). */
async function loadFromHandle(h) {
  const text = await (await h.getFile()).text();
  fileHandle = h;
  if (text.trim()) { const r = importText(text); if (r.err) { fileHandle = null; throw new Error(r.err); } }
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch {}
  render(); await writeFile(); renderBanner();
}
async function newFile() {
  try { fileHandle = await showSaveFilePicker({ suggestedName: 'luceroteka.csv', types: FTYPES }); await idbSet(fileHandle); await writeFile(); renderBanner(); }
  catch (e) { if (e.name !== 'AbortError') fstat(e.message, true); }
}
async function openFile() {
  try {
    const [h] = await showOpenFilePicker({ types: FTYPES });
    await h.requestPermission({ mode: 'readwrite' });
    await loadFromHandle(h); await idbSet(h);
  } catch (e) { if (e.name !== 'AbortError') fstat('No se pudo abrir el archivo: ' + e.message, true); }
}
async function reconnect() {
  try {
    const h = await idbGet();
    if (await h.requestPermission({ mode: 'readwrite' }) !== 'granted') return;
    await loadFromHandle(h); needReconnect = false; renderBanner(); dlgAlert('💾 Archivo reconectado: ' + h.name + '. Los cambios se guardan en él automáticamente.');
  } catch (e) { fstat('Error al reconectar: ' + e.message, true); }
}
async function initFile() {
  if (!FS) { fstat('Este navegador guarda los datos en el propio navegador. Usa «Exportar todo» de vez en cuando.'); renderBanner(); return; }
  fstat('Sin archivo vinculado (los datos se guardan en este navegador).');
  try {
    const h = await idbGet();
    if (h && await h.queryPermission({ mode: 'readwrite' }) === 'granted') await loadFromHandle(h);
    else if (h) { needReconnect = true; fstat('Archivo vinculado: ' + h.name + ' — pulsa «Reconectar archivo».'); }
  } catch (e) { fstat('No se pudo leer el archivo vinculado: ' + e.message, true); }
  renderBanner();
}

}

const isDesk = () => document.body.classList.contains('desk');
const SORT = { books: { k: 'title', d: 1 }, loans: { k: 'date', d: -1 } };
const cmp = (a, b) => String(a ?? '').localeCompare(String(b ?? ''), 'es', { numeric: true });
const th = (t, k, label) => `<th class="sortable" onclick="sortBy('${t}','${k}')">${label}${SORT[t].k === k ? (SORT[t].d > 0 ? ' ▲' : ' ▼') : ''}</th>`;
function sortBy(t, k) { const s = SORT[t]; s.d = s.k === k ? -s.d : 1; s.k = k; render(); }
function applyView(desk) {
  document.body.classList.toggle('desk', desk);
  $('viewBtn').innerHTML = lbl(desk ? '📱 Móvil' : '🖥 PC');
  // en un teléfono, la versión PC usa un ancho de página de 1100 px (como un ordenador)
  $('vp').setAttribute('content', desk ? 'width=1100' : 'width=device-width, initial-scale=1, viewport-fit=cover');
}
const lbl = t => { const [e, ...r] = t.split(' '); return e + '<span class="lbl"> ' + r.join(' ') + '</span>'; };
const THEMES = [['auto', '🌓 Auto'], ['light', '☀ Claro'], ['dark', '🌙 Oscuro']];
function applyTheme(t) {
  if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  $('themeBtn').innerHTML = lbl(THEMES.find(x => x[0] === t)[1]);
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'auto';
  const n = THEMES[(THEMES.findIndex(x => x[0] === cur) + 1) % THEMES.length][0];
  applyTheme(n); try { localStorage.setItem('library.theme', n); } catch {}
}
function renderBanner() {
  const el = $('banner'); let html = '', good = false;
  if (needReconnect) { html = '<span>💾 El archivo de datos está desconectado: los cambios no se guardan en él.</span><button class="btn primary" onclick="reconnect()">Reconectar</button>'; }
  else if (!fileHandle && db.books.length) {
    let t = 0; try { t = +localStorage.getItem('library.lastBackup') || 0; } catch {}
    const days = t ? Math.floor((Date.now() - t) / 864e5) : null;
    if (days === null || days >= 7) html = `<span>⚠ ${days === null ? 'Aún no has hecho ninguna copia.' : `Última copia hace ${days} días.`}</span><button class="btn" onclick="exportCSV()">Exportar todo</button>`;
  }
  el.innerHTML = html; el.classList.toggle('hidden', !html); el.classList.toggle('good', good);
}
function toggleView() {
  const d = !document.body.classList.contains('desk');
  applyView(d); render(); try { localStorage.setItem('library.view', d ? 'desk' : 'mobile'); } catch {}
}
function render() {
  renderBooks(); renderLoans();
  $('t-books').textContent = `Libros (${db.books.length})`;
  const out = db.loans.filter(l => !l.returned).length;
  $('t-loans').textContent = `Préstamos${out ? ` (${out})` : ''}`;
  renderBanner();
}
let v = null; try { v = localStorage.getItem('library.view'); } catch {}
applyView(v ? v === 'desk' : screen.width >= 1000);
let savedTheme = null; try { savedTheme = localStorage.getItem('library.theme'); } catch {}
applyTheme(THEMES.some(x => x[0] === savedTheme) ? savedTheme : 'auto');
render(); initFile();
</script>
</body>
